<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D9CCFF">
<title>倒放挑戰</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Noto+Sans+TC:wght@500;900&display=swap">
<style>
  :root {
    --bg: #d9ccff;
    --ink: #17151c;
    --cream: #fff6e5;
    --coral: #ff6a3d;
    --green: #2fb36b;
    --yellow: #ffc93c;
    --rec: #ff2d55;
    --font: "Outfit", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
    font-size: 16px; line-height: 1.4; min-height: 100vh; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    background-image: radial-gradient(circle at 100% 0%, #ffd1e3 0, transparent 45%), radial-gradient(circle at 0% 100%, #fff1a8 0, transparent 45%);
  }
  button { font-family: inherit; }
  .app { max-width: 440px; margin: 0 auto; padding: 14px 14px 20px; display: flex; flex-direction: column; gap: 12px; min-height: 100vh; }

  header { display: flex; align-items: flex-end; justify-content: space-between; padding: 4px 6px 2px; }
  header h1 { margin: 0; font-size: 34px; font-weight: 900; letter-spacing: -0.01em; line-height: 1; }
  header h1 { display: flex; align-items: center; gap: 8px; }
  header h1 .mark { width: 34px; height: 34px; border-radius: 10px; background: var(--ink); color: var(--cream); display: grid; place-items: center; flex: none; }
  header h1 .mark .ic { width: 20px; height: 20px; }
  .ic { width: 1em; height: 1em; fill: currentColor; display: inline-block; vertical-align: -0.12em; flex: none; }
  header small { font-family: "Outfit", sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; opacity: .55; }
  .reset { border: 2px solid var(--ink); background: transparent; color: var(--ink); border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .reset:active { background: var(--ink); color: var(--cream); }

  .card {
    border-radius: 26px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
    color: var(--cream); box-shadow: 0 10px 0 rgba(23,21,28,.12);
    position: relative; overflow: hidden;
  }
  .card.q { background: var(--coral); }
  .card.m { background: var(--green); }
  .card.o { background: var(--yellow); color: var(--ink); }
  .card .top { display: flex; align-items: center; gap: 12px; }
  .card .txt { flex: 1; min-width: 0; }
  .card .tag { font-family: "Outfit", sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: .8; }
  .card h2 { margin: 2px 0 0; font-size: 21px; font-weight: 900; line-height: 1.15; }
  .card .st { font-size: 13px; opacity: .85; margin-top: 2px; min-height: 1.3em; font-weight: 500; }
  .card .t { font-family: "Outfit", sans-serif; font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; opacity: .8; }

  .face { width: 58px; height: 58px; border-radius: 50%; background: var(--cream); position: relative; flex: none; }
  .face .eye { position: absolute; top: 18px; width: 9px; height: 9px; border-radius: 50%; background: var(--ink); }
  .face .eye.l { left: 16px; } .face .eye.r { right: 16px; }
  .face .mouth { position: absolute; left: 50%; top: 34px; width: 18px; height: 6px; border-radius: 0 0 9px 9px; background: var(--ink); transform: translateX(-50%); transition: all .2s ease; }
  .card[data-state="rec"] .face .mouth { width: 16px; height: 16px; border-radius: 50%; top: 30px; }
  .card[data-state="rec"] .face { box-shadow: 0 0 0 4px var(--rec); animation: blink 1s infinite; }
  .card[data-state="play"] .face .mouth { animation: talk .28s infinite alternate; }
  .card[data-state="play"] .face .eye { transform: scaleY(.35); }
  @keyframes talk { from { width: 12px; height: 5px; } to { width: 22px; height: 14px; border-radius: 50%; top: 31px; } }
  @keyframes blink { 0%,100% { box-shadow: 0 0 0 4px var(--rec); } 50% { box-shadow: 0 0 0 4px rgba(255,45,85,.25); } }

  canvas.wave { width: 100%; height: 36px; display: block; border-radius: 10px; background: rgba(0,0,0,.14); }

  .row { display: flex; gap: 8px; }
  .row > * { flex: 1 1 0; }
  .pill {
    border: 0; border-radius: 999px; padding: 12px 10px; font-size: 15px; font-weight: 900; cursor: pointer;
    background: var(--cream); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    white-space: nowrap; user-select: none; transition: transform .1s ease;
  }
  .pill:active { transform: scale(.97); }
  .pill:disabled { opacity: .45; cursor: default; }
  .pill .ic { width: 16px; height: 16px; }
  .pill.rec .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--rec); transition: border-radius .15s; }
  .pill.rec.live { background: var(--ink); color: var(--cream); }
  .pill.rec.live .dot { border-radius: 3px; }
  .pill:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .err { background: var(--ink); color: #ffb3a7; border-radius: 16px; padding: 10px 14px; font-size: 13px; }
  .note { font-size: 12px; text-align: center; opacity: .6; padding: 0 10px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .card[data-state="rec"] .face, .card[data-state="play"] .face .mouth { animation: none; } }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-rw" viewBox="0 0 24 24"><path d="M11 5 2 12l9 7V5zm10 0-9 7 9 7V5z"/></symbol>
  <symbol id="i-ff" viewBox="0 0 24 24"><path d="M13 5l9 7-9 7V5zM3 5l9 7-9 7V5z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8V4z"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.3 4H3.2A9 9 0 1 0 12 3V0L7 4l5 4V5z"/></symbol>
</svg>
<div class="app">
  <header>
    <div>
      <small>Reverse Challenge</small>
      <h1><span class="mark"><svg class="ic"><use href="#i-rw"/></svg></span>倒放挑戰</h1>
    </div>
    <button class="reset" id="reset"><svg class="ic"><use href="#i-reset"/></svg>下一題</button>
  </header>

  <div class="err" id="err" hidden></div>

  <section class="card q" id="cardQ" data-state="idle">
    <div class="top">
      <div class="face"><span class="eye l"></span><span class="eye r"></span><span class="mouth"></span></div>
      <div class="txt">
        <div class="tag">01 · 出題</div>
        <h2>說一句話</h2>
        <div class="st" id="stQ">對方先摀耳朵。按錄音，說完再按一次。</div>
      </div>
      <div class="t" id="tQ"></div>
    </div>
    <canvas class="wave" id="waveQ" height="36"></canvas>
    <div class="row">
      <button class="pill rec" id="recQ"><span class="dot"></span> 錄音</button>
      <button class="pill" id="playQ" disabled><svg class="ic"><use href="#i-rw"/></svg> 聽倒放</button>
    </div>
  </section>

  <section class="card m" id="cardM" data-state="idle">
    <div class="top">
      <div class="face"><span class="eye l"></span><span class="eye r"></span><span class="mouth"></span></div>
      <div class="txt">
        <div class="tag">02 · 模仿</div>
        <h2>學那段外星語</h2>
        <div class="st" id="stM">聽倒放版，錄下你的模仿。</div>
      </div>
      <div class="t" id="tM"></div>
    </div>
    <canvas class="wave" id="waveM" height="36"></canvas>
    <div class="row">
      <button class="pill rec" id="recM" disabled><span class="dot"></span> 錄音</button>
      <button class="pill" id="playM" disabled><svg class="ic"><use href="#i-ff"/></svg> 聽倒回來</button>
    </div>
  </section>

  <section class="card o" id="cardO" data-state="idle">
    <div class="top">
      <div class="face"><span class="eye l"></span><span class="eye r"></span><span class="mouth"></span></div>
      <div class="txt">
        <div class="tag">03 · 揭曉</div>
        <h2>原聲是什麼？</h2>
        <div class="st" id="stO">猜完再按，聽出題者本來說什麼。</div>
      </div>
      <div class="t" id="tO"></div>
    </div>
    <div class="row">
      <button class="pill" id="playO" disabled><svg class="ic"><use href="#i-play"/></svg> 聽原聲</button>
    </div>
  </section>

  <div class="note">錄音只留在這支手機。iPhone 請用 Safari 開，第一次會問麥克風權限。</div>
</div>

<audio id="player" playsinline preload="auto"></audio>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const MAX_SEC = 15;
  const player = $('player');
  const WAVE = 'rgba(255,246,229,.95)', WAVE_DIM = 'rgba(255,246,229,.5)';
  let ctx = null, stream = null, proc = null, src = null;
  let chunks = [], recording = false, recStart = 0, recTimer = null, activeRec = null, recRate = 48000;
  let raf = null, playToken = 0, playingCard = null;

  const clips = { orig: null, origRev: null, imit: null, imitRev: null };
  const CARD = { Q: $('cardQ'), M: $('cardM'), O: $('cardO') };

  function showErr(msg) { $('err').textContent = msg; $('err').hidden = !msg; }
  function setState(card, s) { card.dataset.state = s; }

  async function freshCtx() {
    if (ctx) { try { await ctx.close(); } catch (e) {} }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') await ctx.resume();
    return ctx;
  }
  async function startRec(which) {
    if (recording) return;
    showErr(''); stopPlayback();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      await freshCtx();
    } catch (e) {
      showErr('拿不到麥克風（' + (e && e.name ? e.name : '未知') + '）。請允許麥克風權限，iPhone 請用 Safari 開啟。');
      return;
    }
    chunks = []; recording = true; activeRec = which; recStart = ctx.currentTime; recRate = ctx.sampleRate;
    src = ctx.createMediaStreamSource(stream);
    proc = ctx.createScriptProcessor(4096, 1, 1);
    proc.onaudioprocess = e => { if (recording) chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
    const mute = ctx.createGain(); mute.gain.value = 0;
    src.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
    const card = CARD[which], btn = $('rec' + which), st = $('st' + which);
    setState(card, 'rec'); btn.classList.add('live'); btn.innerHTML = '<span class="dot"></span> 停止';
    recTimer = setInterval(() => {
      const el = ctx.currentTime - recStart;
      st.textContent = '錄音中 ' + el.toFixed(1) + 's';
      if (el >= MAX_SEC) stopRec();
    }, 100);
  }
  function stopRec() {
    if (!recording) return;
    recording = false; clearInterval(recTimer);
    try { proc.disconnect(); src.disconnect(); } catch (e) {}
    stream.getTracks().forEach(t => t.stop());
    const which = activeRec, card = CARD[which], btn = $('rec' + which);
    setState(card, 'idle'); btn.classList.remove('live'); btn.innerHTML = '<span class="dot"></span> 重錄';
    const len = chunks.reduce((n, c) => n + c.length, 0);
    const data = new Float32Array(len); let o = 0;
    for (const c of chunks) { data.set(c, o); o += c.length; }
    if (ctx) { try { ctx.close(); } catch (e) {} ctx = null; }
    ingest(which, data, recRate);
  }
  function ingest(which, data, rate) {
    const trimmed = trimSilence(data, rate);
    if (trimmed.length < rate * 0.3) { $('st' + which).textContent = '太短了，再錄一次。'; return; }
    const clip = makeClip(trimmed, rate), rev = makeClip(reverse(trimmed), rate);
    if (which === 'Q') {
      if (clips.orig) revoke('orig', 'origRev');
      clips.orig = clip; clips.origRev = rev;
      $('stQ').textContent = '錄好了。把手機交給對方。';
      $('tQ').textContent = fmt(rev.duration);
      drawWave($('waveQ'), rev.data, WAVE);
      $('playQ').disabled = false; $('recM').disabled = false; $('playO').disabled = false;
      $('stM').textContent = '先聽上面的倒放版，再錄你的模仿。';
    } else {
      if (clips.imit) revoke('imit', 'imitRev');
      clips.imit = clip; clips.imitRev = rev;
      $('stM').textContent = '倒回來了，聽聽看像不像原句。';
      $('tM').textContent = fmt(rev.duration);
      drawWave($('waveM'), rev.data, WAVE);
      $('playM').disabled = false;
    }
  }
  function revoke() { for (const k of arguments) { if (clips[k] && clips[k].url) URL.revokeObjectURL(clips[k].url); clips[k] = null; } }
  function trimSilence(d, rate) {
    const th = 0.015; let a = 0, b = d.length - 1;
    while (a < b && Math.abs(d[a]) < th) a++;
    while (b > a && Math.abs(d[b]) < th) b--;
    const pad = Math.floor(rate * 0.08);
    a = Math.max(0, a - pad); b = Math.min(d.length, b + pad);
    return d.slice(a, b);
  }
  function reverse(d) { const r = new Float32Array(d.length); for (let i = 0, n = d.length; i < n; i++) r[i] = d[n - 1 - i]; return r; }
  function makeClip(data, rate) {
    let peak = 0; for (let i = 0; i < data.length; i++) { const v = Math.abs(data[i]); if (v > peak) peak = v; }
    const gain = peak > 0.001 ? Math.min(0.95 / peak, 8) : 1;
    const out = new Float32Array(data.length); for (let i = 0; i < data.length; i++) out[i] = data[i] * gain;
    return { data: out, rate, url: URL.createObjectURL(toWav(out, rate)), duration: out.length / rate };
  }
  function toWav(samples, rate) {
    const n = samples.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, 'data'); v.setUint32(40, n * 2, true);
    for (let i = 0, o = 44; i < n; i++, o += 2) { const x = Math.max(-1, Math.min(1, samples[i])); v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true); }
    return new Blob([buf], { type: 'audio/wav' });
  }
  const fmt = s => s.toFixed(1) + 's';

  function stopPlayback() {
    playToken++;
    try { player.pause(); } catch (e) {}
    if (raf) cancelAnimationFrame(raf), raf = null;
    if (playingCard) { setState(playingCard, 'idle'); playingCard = null; }
  }
  function play(clip, card, canvas) {
    if (!clip) return;
    stopPlayback();
    const token = playToken;
    player.src = clip.url; player.currentTime = 0; player.volume = 1;
    setState(card, 'play'); playingCard = card;
    const p = player.play();
    if (p && p.catch) p.catch(e => { showErr('播放失敗（' + (e && e.name ? e.name : '未知') + '）。確認音量有開，再按一次。'); setState(card, 'idle'); });
    const tick = () => {
      if (token !== playToken) return;
      const prog = clip.duration ? Math.min(player.currentTime / clip.duration, 1) : 0;
      if (canvas) drawWave(canvas, clip.data, WAVE, prog);
      if (!player.ended && !player.paused) raf = requestAnimationFrame(tick);
      else { if (canvas) drawWave(canvas, clip.data, WAVE); setState(card, 'idle'); playingCard = null; }
    };
    tick();
  }

  function drawWave(canvas, data, color, progress) {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth || 300, h = 36;
    if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
    const g = canvas.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    const bars = Math.floor(w / 4), step = Math.floor(data.length / bars) || 1;
    for (let i = 0; i < bars; i++) {
      let peak = 0;
      for (let j = i * step, e = Math.min(data.length, j + step); j < e; j += 4) { const v = Math.abs(data[j]); if (v > peak) peak = v; }
      const bh = Math.max(3, peak * (h - 6));
      g.globalAlpha = progress != null && i / bars > progress ? 0.35 : 1;
      g.fillStyle = color;
      g.fillRect(i * 4 + 1, (h - bh) / 2, 2.4, bh);
    }
    g.globalAlpha = 1;
  }
  function flatLine(canvas) { drawWave(canvas, new Float32Array(200), WAVE_DIM); }

  $('recQ').addEventListener('click', () => recording ? stopRec() : startRec('Q'));
  $('recM').addEventListener('click', () => recording ? stopRec() : startRec('M'));
  $('playQ').addEventListener('click', () => play(clips.origRev, CARD.Q, $('waveQ')));
  $('playM').addEventListener('click', () => play(clips.imitRev, CARD.M, $('waveM')));
  $('playO').addEventListener('click', () => play(clips.orig, CARD.O, null));
  $('reset').addEventListener('click', () => {
    if (recording) stopRec();
    stopPlayback();
    revoke('orig', 'origRev', 'imit', 'imitRev');
    ['playQ', 'playM', 'playO', 'recM'].forEach(id => $(id).disabled = true);
    $('recQ').innerHTML = '<span class="dot"></span> 錄音'; $('recM').innerHTML = '<span class="dot"></span> 錄音';
    $('stQ').textContent = '對方先摀耳朵。按錄音，說完再按一次。';
    $('stM').textContent = '聽倒放版，錄下你的模仿。';
    $('tQ').textContent = ''; $('tM').textContent = '';
    flatLine($('waveQ')); flatLine($('waveM'));
    showErr('');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  flatLine($('waveQ')); flatLine($('waveM'));
  window.addEventListener('resize', () => {
    if (clips.origRev) drawWave($('waveQ'), clips.origRev.data, WAVE); else flatLine($('waveQ'));
    if (clips.imitRev) drawWave($('waveM'), clips.imitRev.data, WAVE); else flatLine($('waveM'));
  });
})();
</script>
</html>
